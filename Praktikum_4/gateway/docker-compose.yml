
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: unib-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  gateway-bridge:
    build: .
    container_name: unib-edge-gateway
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: unib/iot/telemetry
      SERIAL_URL: rfc2217://host.docker.internal:4000
      SERIAL_BAUDRATE: 115200
    restart: unless-stopped

volumes:
  mosquitto_data:
